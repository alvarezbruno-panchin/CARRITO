<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altoque Roque</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>Mercado Pago Trucheli</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="carrito.html" class="carrito-link" aria-label="Carrito de compras">
                    <span class="carrito-icon">🛒</span>
                    <span id="contadorcarrito" class="contador-carrito" style="display:none;">0</span>
                </a></li>
            </ul>
        </nav>
    </header>

    <main class="carrito-contenedor">
        <div class="carrito-header">
            <h2>Carrito de compras</h2>
            <a href="index.html" class="btn-seguir">Seguir comprando</a>
        </div>

        <table class="tabla-carrito">
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Cantidad</th>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>

        <div class="carrito-acciones">
            <button id="btn-finalizar-compra" class="btn-finalizar" type="button">Finalizar compra</button>
        </div>
    </main>

    <footer> 
        <h2>Información de contacto</h2>
        <p>Av. Siempre Viva 550</p>
        <p>+54 9 351 3325737</p>
    </footer>

    <script type="module" src="carrito.js"></script>
</body>
</html>
